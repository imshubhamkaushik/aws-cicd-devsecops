spring.application.name=payment-svc
server.port=11006

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Bounded connection pool: every pod of every service shares one small database.
# max-lifetime and keepalive avoid stale connections after idle periods or server-side recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# JWT_PUBLIC_KEY_B64 verifies user access tokens; each service has its own service-token key.
# Only user-svc receives JWT_PRIVATE_KEY_B64 for signing end-user tokens.

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=11006
management.health.db.enabled=true

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in infra/helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Per-instance safety limits; the gateway remains the primary client-wide rate limiter.
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.general.requests-per-minute=${RATE_LIMIT_GENERAL_RPM:300}
security.rate-limit.auth.requests-per-minute=${RATE_LIMIT_AUTH_RPM:10}
