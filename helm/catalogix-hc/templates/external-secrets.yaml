{{- if eq .Values.global.cloudProvider "aws" }}
# One ExternalSecret owns 'catalogix-secrets' (two controllers writing the same Secret can
# overwrite each other's keys). dataFrom.extract syncs every key of the app secret verbatim
# and lowercase (see _helpers.tpl commonEnv); the RDS master password is deliberately not synced.
# Pods read these as env vars at startup, so a rotated value needs a restart.
# Rendered only when global.cloudProvider is "aws"; otherwise secrets-local.yaml creates the Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogix-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalogix-secrets
    creationPolicy: Owner
  {{- if .Values.secretsManager.operatorSecretName }}
  # Listed explicitly rather than extracted wholesale: the same secret also holds the RDS
  # master password and Grafana login, which must not reach this namespace. A missing key
  # fails the sync, so pods wait instead of starting without credentials.
  data:
    {{- range $key := list "rabbitmq_user" "rabbitmq_password" "seed_admin_password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.secretsManager.operatorSecretName }}
        property: {{ $key }}
    {{- end }}
  {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.secretsManager.appSecretName }}
{{- end }}
