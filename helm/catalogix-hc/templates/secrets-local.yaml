{{- if ne .Values.global.cloudProvider "aws" }}
# Local equivalent of external-secrets.yaml: creates the same 'catalogix-secrets'
# Secret with the same keys, so the other templates work unchanged.
# Values are generated on first install and reused on `helm upgrade`, so a
# redeploy does not rotate database passwords or the JWT key.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "catalogix-secrets" }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: catalogix-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  jwt_secret: {{ include "catalogix.keep" (dict "data" $data "key" "jwt_secret" "len" 48) | quote }}
  rabbitmq_user: "catalogix"
  rabbitmq_password: {{ include "catalogix.keep" (dict "data" $data "key" "rabbitmq_password" "len" 20) | quote }}
  local_db_user: "postgres"
  local_db_password: {{ include "catalogix.keep" (dict "data" $data "key" "local_db_password" "len" 20) | quote }}
  {{- range $name, $svc := .Values.backendServices }}
  {{- $key := $name | replace "-" "_" }}
  db_user_{{ $key }}: {{ $key | quote }}
  db_password_{{ $key }}: {{ include "catalogix.keep" (dict "data" $data "key" (printf "db_password_%s" $key) "len" 20) | quote }}
  {{- end }}
{{- end }}
