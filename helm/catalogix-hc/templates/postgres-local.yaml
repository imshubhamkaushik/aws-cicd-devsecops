{{- if ne .Values.global.cloudProvider "aws" }}
# In-cluster Postgres for local Kubernetes, standing in for RDS. Like the
# db-roles Terraform module, it creates one database and one login role per
# backend service. Passwords come from catalogix-secrets (secrets-local.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-local-init
  namespace: {{ .Release.Namespace }}
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -euo pipefail

    create_service_db() {
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
           -v role="$1" -v db="$2" -v pw="$3" <<'EOSQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'pw')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'role')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
    EOSQL
    }

    {{- range $name, $svc := .Values.backendServices }}
    {{- $key := $name | replace "-" "_" }}
    create_service_db "{{ $key }}" "{{ $svc.dbName }}" "$DB_PASSWORD_{{ $key }}"
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-local
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: postgres-local
  replicas: 1
  selector:
    matchLabels:
      app: postgres-local
  template:
    metadata:
      labels:
        app: postgres-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: "postgres:18-alpine"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: local_db_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: local_db_password
            # Postgres requires SOME initial DB name at first boot. Never
            # used by any service — same reasoning as terraform's rds
            # module's catalogix_admin db_name, see env/dev/main.tf.
            - name: POSTGRES_DB
              value: "postgres"
{{- range $name, $svc := .Values.backendServices }}
{{- $key := $name | replace "-" "_" }}
            - name: DB_PASSWORD_{{ $key }}
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: db_password_{{ $key }}
{{- end }}
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          # First start also runs the init script, so allow up to 150s.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d postgres'
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d postgres'
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d postgres'
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: init-script
          configMap:
            name: postgres-local-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.database.local.storageClass }}
        storageClassName: {{ .Values.database.local.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.local.storageSize | default "1Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-local
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: postgres-local
  ports:
    - port: 5432
{{- end }}
