global:
  imageRegistry: ""
  imageTag: "2.0-0"
  cloudProvider: "aws"

database:
  host: ""          # set at deploy time: --set database.host=<RDS endpoint from SSM>
  port: 5432
  # RDS enforces TLS, so require it from the client too. The local overlay sets "disable".
  sslMode: "require"
  # Each service authenticates with its own role (db_user_<svc>/db_password_<svc>, see
  # _helpers.tpl commonEnv), created by terraform/platform-infra/modules/db-roles.

# DB passwords, JWT secret and RabbitMQ credentials come from AWS Secrets Manager via
# templates/external-secrets.yaml, not from here.
secretsManager:
  dbSecretName: "catalogix-cluster-staging/db-credentials"
  appSecretName: "catalogix-cluster-staging/app-secrets"   # JWT_SECRET + RabbitMQ creds

rabbitmq:
  host: "rabbitmq"        # in-cluster headless Service, see templates/rabbitmq.yaml
  port: 5672
  replicas: 1   # 3-replica clustering only gives real HA with >=3 nodes, one replica each
  image: "rabbitmq:4-management-alpine"
  storageClass: "gp3-sc"
  storageSize: "1Gi"   # per replica: each pod gets its own PVC
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

ingress:
  enabled: true
  host: ""
  # ACM certificate ARN for the ALB's HTTPS:443 listener. Empty means HTTP:80 only; set at
  # deploy time with --set ingress.tlsCertArn=<arn>.
  tlsCertArn: ""
  paths:
    frontend: /

hpa:
  enabled: true

# One entry per backend service; consumed generically by the backend templates.
backendServices:

  user-svc:
    dbName: catalogix-users
    usesRabbitMQ: true   # publishes user.email-verification-requested / user.password-reset-requested
    image: { repository: "user-svc", pullPolicy: "IfNotPresent" }
    port: 11005
    replicaCount: 2
    routeToALB: true
    ingressPaths:
      - /users
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: ALLOWED_ORIGINS
        value: "*"
      - name: CORS_ALLOW_CREDENTIALS
        value: "true"
      - name: ADMIN_EMAILS
        value: "admin@example.com"
      # Keep false until ingress.tlsCertArn is set: a Secure cookie is not stored over HTTP.
      - name: REFRESH_COOKIE_SECURE
        value: "false"
      # Bootstrap admin settings: see values-dev.yaml.
      - name: SEED_DATA
        value: "true"
      - name: SEED_ADMIN_EMAIL
        value: "admin@catalogix.local"
      - name: SEED_ADMIN_PASSWORD
        value: ""

  catalog-svc:
    dbName: catalogix-catalog
    image: { repository: "catalog-svc", pullPolicy: "IfNotPresent" }
    port: 11002
    replicaCount: 2
    routeToALB: true
    ingressPaths:
      - /products
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      # Required: see values-dev.yaml.
      - name: SEED_DATA
        value: "true"
      # Required by every service.
      - name: ALLOWED_ORIGINS
        value: "*"

  inventory-svc:
    dbName: catalogix-inventory
    image: { repository: "inventory-svc", pullPolicy: "IfNotPresent" }
    port: 11003
    replicaCount: 2
    # Internal-only, no ALB path (same rule as the gateway's nginx.conf).
    routeToALB: false
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: ALLOWED_ORIGINS
        value: "*"

  cart-svc:
    dbName: catalogix-cart
    image: { repository: "cart-svc", pullPolicy: "IfNotPresent" }
    port: 11004
    replicaCount: 2
    routeToALB: true
    ingressPaths:
      - /cart
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: CATALOG_SVC_URL
        value: "http://catalog-svc:11002"
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      - name: ALLOWED_ORIGINS
        value: "*"


  payment-svc:
    dbName: catalogix-payment
    image: { repository: "payment-svc", pullPolicy: "IfNotPresent" }
    port: 11006
    replicaCount: 2
    # Internal-only: checkout-svc is its only caller. No ALB path.
    routeToALB: false
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: ALLOWED_ORIGINS
        value: "*"

  checkout-svc:
    dbName: catalogix-checkout
    usesRabbitMQ: true   # publishes order.confirmed / order.cancelled
    image: { repository: "checkout-svc", pullPolicy: "IfNotPresent" }
    port: 11007
    replicaCount: 2
    routeToALB: true
    ingressPaths:
      - /orders
      - /admin
    resources:
      requests: { cpu: "150m", memory: "192Mi" }   # orchestrates 5 downstream calls per checkout — a bit more headroom
      limits: { cpu: "600m", memory: "640Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 70, memoryUtilization: 75 }
    extraEnv:
      - name: CATALOG_SVC_URL
        value: "http://catalog-svc:11002"
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      - name: PAYMENT_SVC_URL
        value: "http://payment-svc:11006"
      - name: CART_SVC_URL
        value: "http://cart-svc:11004"
      - name: USER_SVC_URL
        value: "http://user-svc:11005"
      - name: ALLOWED_ORIGINS
        value: "*"

  notification-svc:
    dbName: catalogix-notification
    usesRabbitMQ: true   # consumes order.* and user.* events
    image: { repository: "notification-svc", pullPolicy: "IfNotPresent" }
    port: 11008
    replicaCount: 2
    # Exposes the admin-only GET /notifications, so it must be routed through the ALB.
    routeToALB: true
    ingressPaths:
      - /notifications
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: MAIL_FROM
        value: "noreply@catalogix.local"
      # MAIL_HOST/MAIL_PORT point at a real SMTP provider in staging.
      - name: USER_SVC_URL
        value: "http://user-svc:11005"
      - name: ALLOWED_ORIGINS
        value: "*"


gateway:
  image:
    repository: "gateway"
    pullPolicy: "IfNotPresent"
  replicaCount: 2
  service:
    type: "ClusterIP"
    port: 11000
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 75

frontend:
  image:
    repository: "frontend"
    pullPolicy: "IfNotPresent"
  replicaCount: 2
  service:
    type: "ClusterIP"
    port: 11001
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }
  hpa:
    minReplicas: 3
    maxReplicas: 4
    cpuUtilization: 75

monitoring:
  enabled: true

aws:
  accountId: ""
  region: "ap-south-1"
