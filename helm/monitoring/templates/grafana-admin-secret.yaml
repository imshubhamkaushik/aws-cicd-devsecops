{{- if .Values.global.operatorSecretName }}
# Grafana admin login chosen by the operator (scripts/python/credentials.py), read from
# Secrets Manager by External Secrets. Without it Grafana keeps the chart's default credentials.
# Only the two Grafana keys are pulled; the same secret also holds the RDS master password.
# Wired up by the pipeline: --set kube-prometheus-stack.grafana.admin.existingSecret=grafana-admin-secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.global.operatorSecretName }}
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.global.operatorSecretName }}
        property: grafana_admin_password
{{- end }}
