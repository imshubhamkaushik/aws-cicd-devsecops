apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    # Monitoring is not user-facing; the internal ALB prevents accidental public exposure.

    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/group.name: monitoring
    # Access: use port-forward in dev, e.g.
    #   kubectl port-forward svc/monitoring-grafana 3000:3000 -n monitoring
    #   kubectl port-forward svc/monitoring-kube-prometheus-stack-prometheus 9090:9090 -n monitoring
    #   kubectl port-forward svc/monitoring-kube-prometheus-stack-alertmanager 9093:9093 -n monitoring
    # For hostname access: add a Route53 private hosted zone with alias records to this ALB
    # (optionally automated by External DNS).
spec:
  ingressClassName: alb
  rules:
    - host: grafana.internal.catalogix.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 3000

    - host: prometheus.internal.catalogix.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-stack-prometheus
                port:
                  number: 9090

    - host: alertmanager.internal.catalogix.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-stack-alertmanager
                port:
                  number: 9093
