# Alertmanager runs in the `monitoring` namespace and Secrets are namespace-scoped, so it
# cannot reuse the app chart's `catalogix-secrets`. Pulls from the dedicated Secrets Manager
# entry of terraform/platform-infra's module.alerting_secrets, deliberately not the app
# secret (JWT/RabbitMQ/DB credentials do not belong in this namespace).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.global.alertingSecretName }}
