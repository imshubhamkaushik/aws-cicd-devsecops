spring.application.name=user-svc
server.port=11005

# Endpoints a caller reaches before they can possibly have a JWT yet (or, for
# /users/logout, is designed to work off the refresh cookie alone — see its
# @CookieValue-only signature in UserController). Every other endpoint in
# this service, and every endpoint in every other service, still requires a
# valid Bearer token — this list is additive to /health and /actuator*, not
# a replacement for the default deny-by-default behavior in JwtAuthFilter.
security.public-paths=/users/register,/users/login,/users/refresh,/users/logout,/users/verify-email,/users/forgot-password,/users/reset-password

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Bounded connection pool: every pod of every service shares one small database.
# max-lifetime and keepalive avoid stale connections after idle periods or server-side recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# Shared secret used to sign/verify JWTs. MUST be identical across every service,
# and at least 32 chars (HS256 = 256-bit key).
# (JWT_SECRET, JWT_EXPIRATION_MS, REFRESH_TOKEN_EXPIRATION_MS and SEED_ADMIN_EMAIL
# are read directly from the
# environment via @Value("${JWT_SECRET}") etc. — declared here only as docs.)

# RabbitMQ: user-svc publishes user.email-verification-requested and
# user.password-reset-requested here (see UserEventPublisher) for notification-svc.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
# In Spring Boot 3, endpoints are usually enabled by default. The new access property controls permission levels. read_only is the standard replacement for "enabled".
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized

# The configuration hierarchy was reorganized to group properties by the monitoring system (Prometheus) rather than the function (metrics.export).
management.prometheus.metrics.export.enabled=true
management.server.port=11005
management.health.db.enabled=true

# Enable histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Explicitly enable distribution statistics
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s

management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Publishing retries: a brief broker restart (e.g. a Helm upgrade touching RabbitMQ) no longer
# silently drops verification / password-reset / order emails. Three attempts, 0.5s then 1s
# apart. (A longer outage still loses the event — there is no outbox for these.)
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.multiplier=2.0
