spring.application.name=checkout-svc
server.port=11007

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Bounded connection pool: every pod of every service shares one small database.
# max-lifetime and keepalive avoid stale connections after idle periods or server-side recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Flyway owns the schema (see src/main/resources/db/migration); Hibernate only validates
# that the entities match what Flyway created, it never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.sql.init.mode=never

# JWT_SECRET is read directly from the environment via @Value("${JWT_SECRET}") — must
# match every other service. checkout-svc is also the only service that MINTS
# tokens itself (system tokens, see JwtService.generateSystemToken), used by
# CompensationOutboxProcessor for background retries against inventory-svc.

# Downstream services called directly over HTTP: placing, paying for and cancelling an order
# needs an immediate yes/no, which does not fit asynchronous messaging.
CATALOG_SVC_URL=${CATALOG_SVC_URL:http://localhost:11002}
INVENTORY_SVC_URL=${INVENTORY_SVC_URL:http://localhost:11003}
PAYMENT_SVC_URL=${PAYMENT_SVC_URL:http://localhost:11006}
CART_SVC_URL=${CART_SVC_URL:http://localhost:11004}
USER_SVC_URL=${USER_SVC_URL:http://localhost:11005}

# RabbitMQ: checkout-svc publishes order.confirmed/order.cancelled events
# here (see OrderEventPublisher) for notification-svc to consume.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# How often the outbox processor retries queued compensations (release stock
# / release operation) that could not be delivered live. See
# CompensationOutboxProcessor. No default needed here — the @Scheduled
# annotation's own inline default (5000ms) already covers the unset case;
# defining it here too as OUTBOX_POLL_INTERVAL_MS=${OUTBOX_POLL_INTERVAL_MS:5000}
# would be a self-referencing property Spring can't resolve.

# Circuit breakers around the two synchronous, latency-sensitive calls on the
# order-placement hot path. Business outcomes (product not found /
# insufficient stock) are excluded from the failure count — see each
# client's Javadoc.
resilience4j.circuitbreaker.instances.catalogSvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogSvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.catalogSvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogSvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogSvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogSvc.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.catalogSvc.register-health-indicator=true
resilience4j.circuitbreaker.instances.catalogSvc.ignore-exceptions=com.catalogix.checkout.exception.ProductUnavailableException

resilience4j.circuitbreaker.instances.inventorySvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventorySvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventorySvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventorySvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventorySvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventorySvc.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.inventorySvc.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventorySvc.ignore-exceptions=com.catalogix.checkout.exception.ProductUnavailableException

resilience4j.circuitbreaker.instances.userSvc.sliding-window-size=10
resilience4j.circuitbreaker.instances.userSvc.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userSvc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userSvc.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userSvc.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userSvc.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.userSvc.register-health-indicator=true
resilience4j.circuitbreaker.instances.userSvc.ignore-exceptions=com.catalogix.checkout.exception.AddressUnavailableException

management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=11007
management.health.db.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Publishing retries: a brief broker restart (e.g. a Helm upgrade touching RabbitMQ) no longer
# silently drops verification / password-reset / order emails. Three attempts, 0.5s then 1s
# apart. (A longer outage still loses the event — there is no outbox for these.)
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.multiplier=2.0
