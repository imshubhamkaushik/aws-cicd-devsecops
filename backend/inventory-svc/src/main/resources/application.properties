spring.application.name=inventory-svc
server.port=11003

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Bounded connection pool: every pod of every service shares one small database.
# max-lifetime and keepalive avoid stale connections after idle periods or server-side recycling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Graceful shutdown: on SIGTERM stop accepting new requests but let in-flight ones finish
# (up to the timeout) before exiting. Pairs with the preStop sleep and
# terminationGracePeriodSeconds in helm/catalogix-hc — together they stop a rolling update
# from dropping requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
