# =============================================================================
# SonarQube — unified analysis for all Catalogix code
# Scanned by the sonar-scanner-cli Docker image in Jenkinsfile.app-cicd.
# One project key, one dashboard, one quality gate for the whole monorepo.
# This root file is the single SonarQube configuration for the monorepo.
# =============================================================================

sonar.projectKey=catalogix
sonar.projectName=Catalogix — All Services
# Overridden per build by Jenkinsfile.app-cicd (-Dsonar.projectVersion=<IMAGE_TAG>)
# so SonarQube's "since previous version" new-code period actually advances.
sonar.projectVersion=2.0

sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Sources: 7 backend services + the shared security-common module (JWT
# validation, rate limiting, and CORS) + the React frontend.
# -----------------------------------------------------------------------------
sonar.sources=\
    app/backend/security-common/src/main/java,\
    app/backend/user-svc/src/main/java,\
    app/backend/catalog-svc/src/main/java,\
    app/backend/inventory-svc/src/main/java,\
    app/backend/cart-svc/src/main/java,\
    app/backend/payment-svc/src/main/java,\
    app/backend/checkout-svc/src/main/java,\
    app/backend/notification-svc/src/main/java,\
    app/frontend/src

# Frontend tests live next to the code they test (app/frontend/src/**/*.test.jsx),
# so app/frontend/src is listed as both a source and a test root; the inclusion /
# exclusion patterns below decide which files are which.
sonar.tests=\
    app/backend/security-common/src/test/java,\
    app/backend/user-svc/src/test/java,\
    app/backend/catalog-svc/src/test/java,\
    app/backend/inventory-svc/src/test/java,\
    app/backend/cart-svc/src/test/java,\
    app/backend/payment-svc/src/test/java,\
    app/backend/checkout-svc/src/test/java,\
    app/backend/notification-svc/src/test/java,\
    app/frontend/src
sonar.test.inclusions=\
    app/backend/**/src/test/java/**/*.java,\
    app/frontend/src/**/*.test.js,\
    app/frontend/src/**/*.test.jsx,\
    app/frontend/src/setupTests.js

# -----------------------------------------------------------------------------
# Java bytecode (needed for accurate type resolution / dataflow). Wildcards:
# every module that was compiled this run is picked up automatically. The
# pipeline runs `mvn verify` for changed services and `mvn test-compile` for
# the rest, so all of them have classes by the time this scan runs.
# -----------------------------------------------------------------------------
sonar.java.binaries=app/backend/*/target/classes
sonar.java.test.binaries=app/backend/*/target/test-classes

# -----------------------------------------------------------------------------
# Coverage. JaCoCo reports come from `mvn verify`; the frontend lcov report
# from `npm run test:coverage`. Both are only produced for what was tested in
# THIS run, so coverage of untouched modules shows as missing rather than
# stale — gate on new-code coverage, not overall coverage.
# -----------------------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=app/backend/*/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=app/frontend/coverage/lcov.info

# Frontend
sonar.javascript.file.suffixes=.js,.jsx

sonar.exclusions=\
    app/frontend/build/**,\
    app/frontend/coverage/**,\
    app/frontend/node_modules/**,\
    app/frontend/src/**/*.test.js,\
    app/frontend/src/**/*.test.jsx,\
    app/frontend/src/setupTests.js,\
    **/target/**,\
    **/*.min.js
sonar.coverage.exclusions=app/frontend/src/index.jsx,app/frontend/src/components/ui/**

# SCM data isn't available inside the scanner container
sonar.scm.disabled=true

# Exclude config files from copy-paste detection
sonar.cpd.exclusions=**/config/**
