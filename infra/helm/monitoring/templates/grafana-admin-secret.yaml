{{- if .Values.global.observabilitySecretName }}
# Grafana admin login chosen by the operator (scripts/python/aws/credentials.py), read directly
# from the observability category. Database and application credentials are not in this secret.
# Wired up by the pipeline: --set kube-prometheus-stack.grafana.admin.existingSecret=grafana-admin-secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.global.observabilitySecretName }}
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.global.observabilitySecretName }}
        property: grafana_admin_password
{{- end }}
