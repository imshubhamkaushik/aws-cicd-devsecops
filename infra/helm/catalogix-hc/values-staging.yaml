# General service traffic is relaxed; authentication endpoints have a separate stricter bucket.
# The gateway remains the primary client-wide limiter, while this per-pod filter is a guardrail.
rateLimit:
  enabled: true
  generalRequestsPerMinute: 300
  authRequestsPerMinute: 10

global:
  imageRegistry: ""
  imageTag: "2.0-0"
  cloudProvider: "aws"

database:
  host: ""          # set at deploy time: --set database.host=<RDS endpoint from SSM>
  port: 5432
  # RDS enforces TLS, so require it from the client too. The local overlay sets "disable".
  sslMode: "require"
  # Each service authenticates with its own role (db_user_<svc>/db_password_<svc>, see
  # _helpers.tpl commonEnv), created by infra/terraform/platform-infra/modules/db-roles.

# Per-service DB credentials, RabbitMQ credentials and the JWT keys come from AWS Secrets Manager
# via templates/external-secrets.yaml, not from here. The pipeline overrides appSecretName with
# "<cluster name>/app-secrets".
# operatorSecretName is deliberately not set: nothing creates a staging operator-credentials
# secret, so no seed_admin_password reaches the cluster and no admin account is seeded until one is
# created (see infra/helm/catalogix-hc/README.md).
secretsManager:
  appSecretName: "catalogix-cluster-staging/app-secrets"   # DB/RabbitMQ/app credentials; JWT keys are in the separate jwt-keys secret
  jwtKeysSecretName: "catalogix-cluster-staging/jwt-keys"  # user-token pair (private key only in user-svc) + one internal pair shared by all services

rabbitmq:
  host: "rabbitmq"        # in-cluster headless Service, see templates/rabbitmq.yaml
  port: 5672
  replicas: 1   # 3-replica clustering only gives real HA with >=3 nodes, one replica each
  image: "rabbitmq:4-management-alpine"
  storageClass: "gp3-sc"
  storageSize: "1Gi"   # per replica: each pod gets its own PVC
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

ingress:
  enabled: true
  host: ""
  # ACM certificate ARN for the ALB's HTTPS:443 listener. Empty means HTTP:80 only; set at
  # deploy time with --set ingress.tlsCertArn=<arn>.
  tlsCertArn: ""

hpa:
  enabled: true

# One entry per backend service; consumed generically by the backend templates.
backendServices:

  user-svc:
    dbName: catalogix-users
    usesRabbitMQ: true   # publishes user.email-verification-requested / user.password-reset-requested
    image: { repository: "user-svc", pullPolicy: "IfNotPresent" }
    port: 11005
    # FRONTEND_BASE_URL and REFRESH_COOKIE_SECURE are derived from ingress.host / ingress.tlsCertArn.
    publicUrlEnv: true
    replicaCount: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      # Bootstrap admin: see values-dev.yaml. Without a seed_admin_password key in the synced
      # secret the variable is absent and no admin account is created.
      - name: SEED_ADMIN_EMAIL
        value: "admin@catalogix.local"
      - name: SEED_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: catalogix-secrets
            key: seed_admin_password
            optional: true

  catalog-svc:
    dbName: catalogix-catalog
    image: { repository: "catalog-svc", pullPolicy: "IfNotPresent" }
    port: 11002
    replicaCount: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      # Required: see values-dev.yaml.
      - name: SEED_DATA
        value: "true"

  inventory-svc:
    dbName: catalogix-inventory
    image: { repository: "inventory-svc", pullPolicy: "IfNotPresent" }
    port: 11003
    replicaCount: 2
    # Internal-only: no route through the gateway (see app/gateway/nginx.conf).
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }

  cart-svc:
    dbName: catalogix-cart
    image: { repository: "cart-svc", pullPolicy: "IfNotPresent" }
    port: 11004
    replicaCount: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: CATALOG_SVC_URL
        value: "http://catalog-svc:11002"
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"

  payment-svc:
    dbName: catalogix-payment
    image: { repository: "payment-svc", pullPolicy: "IfNotPresent" }
    port: 11006
    replicaCount: 2
    # Internal-only: checkout-svc is its only caller. No ALB path.
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }

  checkout-svc:
    dbName: catalogix-checkout
    usesRabbitMQ: true   # publishes order.confirmed / order.cancelled
    image: { repository: "checkout-svc", pullPolicy: "IfNotPresent" }
    port: 11007
    replicaCount: 2
    resources:
      requests: { cpu: "150m", memory: "192Mi" }   # orchestrates 5 downstream calls per checkout — a bit more headroom
      limits: { cpu: "600m", memory: "640Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 70, memoryUtilization: 75 }
    extraEnv:
      - name: CATALOG_SVC_URL
        value: "http://catalog-svc:11002"
      - name: INVENTORY_SVC_URL
        value: "http://inventory-svc:11003"
      - name: PAYMENT_SVC_URL
        value: "http://payment-svc:11006"
      - name: CART_SVC_URL
        value: "http://cart-svc:11004"
      - name: USER_SVC_URL
        value: "http://user-svc:11005"

  notification-svc:
    dbName: catalogix-notification
    usesRabbitMQ: true   # consumes order.* and user.* events
    image: { repository: "notification-svc", pullPolicy: "IfNotPresent" }
    port: 11008
    replicaCount: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    hpa: { minReplicas: 3, maxReplicas: 4, cpuUtilization: 75, memoryUtilization: 75 }
    extraEnv:
      - name: MAIL_FROM
        value: "noreply@catalogix.local"
      # MAIL_HOST/MAIL_PORT point at a real SMTP provider in staging.
      - name: USER_SVC_URL
        value: "http://user-svc:11005"

gateway:
  image:
    repository: "gateway"
    pullPolicy: "IfNotPresent"
  replicaCount: 2
  service:
    type: "ClusterIP"
    port: 11000
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 75

frontend:
  image:
    repository: "frontend"
    pullPolicy: "IfNotPresent"
  replicaCount: 2
  service:
    type: "ClusterIP"
    port: 11001
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }
  hpa:
    minReplicas: 3
    maxReplicas: 4
    cpuUtilization: 75

# Inbound traffic rules between pods (templates/networkpolicy.yaml). Needs a network plugin that
# enforces NetworkPolicy; on EKS the VPC CNI add-on is configured for it in the eks Terraform module.
networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
