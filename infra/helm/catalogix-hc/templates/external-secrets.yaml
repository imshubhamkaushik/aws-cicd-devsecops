{{- if eq .Values.global.cloudProvider "aws" }}
# One ExternalSecret owns 'catalogix-secrets' (two controllers writing the same Secret can
# overwrite each other's keys). dataFrom.extract syncs every key of the app secret verbatim
# and lowercase (see _helpers.tpl commonEnv); the RDS master password is deliberately not synced.
# Pods read these as env vars at startup, so a rotated value needs a restart.
# Rendered only when global.cloudProvider is "aws"; otherwise secrets-local.yaml creates the Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogix-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalogix-secrets
    creationPolicy: Owner
  {{- if .Values.secretsManager.applicationCredentialsSecretName }}
  # Application credentials live in their own category secret. The RDS credentials are not
  # available to ESO's application namespace, and Grafana credentials are kept in monitoring.
  data:
    {{- range $key := list "rabbitmq_user" "rabbitmq_password" "seed_admin_password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.secretsManager.applicationCredentialsSecretName }}
        property: {{ $key }}
    {{- end }}
  {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.secretsManager.appSecretName }}
{{- end }}

---
{{- if eq .Values.global.cloudProvider "aws" }}
# Signing keys are separated from the general app secret so they can be rotated and permissioned
# independently. This remote JSON must contain jwt_private_key_b64, jwt_public_key_b64,
# internal_jwt_private_key_b64 and internal_jwt_public_key_b64 values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogix-jwt-keys
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalogix-jwt-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secretsManager.jwtKeysSecretName must name the AWS Secrets Manager secret containing JWT key material" .Values.secretsManager.jwtKeysSecretName }}
{{- end }}
