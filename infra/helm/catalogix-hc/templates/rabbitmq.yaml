# Self-hosted RabbitMQ, clustered (3 replicas) for HA. Requires:
#   1. Peer discovery (rabbitmq_peer_discovery_k8s plugin + RBAC below) so the
#      pods can find and join each other.
#   2. A shared Erlang cookie; pods refuse to cluster with differing cookies.
#   3. Quorum queues declared by the app (notification-svc RabbitMQConfig);
#      clustering the broker alone does not make a queue survive node loss.

# ─── RBAC — lets the peer-discovery plugin list pods/endpoints via the K8s API ───
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: rabbitmq-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: rabbitmq-peer-discovery
  apiGroup: rbac.authorization.k8s.io

---
# ─── Cluster config — enables the peer discovery plugin + tells it how to find peers ───
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: {{ .Release.Namespace }}
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s,rabbitmq_prometheus].
  rabbitmq.conf: |
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.service_name = rabbitmq
    cluster_formation.node_cleanup.interval = 30
    cluster_formation.node_cleanup.only_log_warning = true
    # pause_minority: on a partition the minority side stops serving rather
    # than letting the two halves diverge.
    cluster_partition_handling = pause_minority
    loopback_users.guest = false

---
# ─── Erlang cookie — generated once and reused across `helm upgrade` via `lookup` ───
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "rabbitmq-erlang-cookie" }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-erlang-cookie
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if $existingSecret }}
  cookie: {{ index $existingSecret.data "cookie" }}
  {{- else }}
  cookie: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: rabbitmq
  replicas: {{ .Values.rabbitmq.replicas | default 3 }}
  podManagementPolicy: Parallel  # nodes must start together to cluster
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      serviceAccountName: rabbitmq-sa
      # Soft anti-affinity: a hard rule could leave a replica Pending when the
      # node group is scaled down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rabbitmq
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      # RabbitMQ needs its Erlang cookie owned by the rabbitmq user with mode 600, which a
      # Secret mount can't express. This initContainer copies and chmods/chowns it as root before
      # the non-root main container starts; both share the PVC.
      initContainers:
        - name: erlang-cookie-setup
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              cp /secret-cookie/cookie /var/lib/rabbitmq/.erlang.cookie
              chmod 600 /var/lib/rabbitmq/.erlang.cookie
              chown 999:999 /var/lib/rabbitmq/.erlang.cookie
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: erlang-cookie-secret
              mountPath: /secret-cookie
              readOnly: true
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image }}"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: clustering
              containerPort: 25672
            - name: epmd
              containerPort: 4369
            - name: metrics
              containerPort: 15692
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  # Lowercase: must match the Secrets Manager JSON key verbatim
                  # (external-secrets.yaml uses dataFrom.extract).
                  key: rabbitmq_user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: catalogix-secrets
                  key: rabbitmq_password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-erlang-cookie
                  key: cookie
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(POD_NAME).rabbitmq.{{ .Release.Namespace }}.svc.cluster.local"
          resources: {{ toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: erlang-cookie-secret
          secret:
            secretName: rabbitmq-erlang-cookie
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.rabbitmq.storageClass | default "gp3-sc" }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storageSize | default "2Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None   # headless: StatefulSet pod DNS and peer discovery
  publishNotReadyAddresses: true  # pods are not ready until clustered, so peers must be discoverable before then
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
    - name: clustering
      port: 25672
    - name: epmd
      port: 4369
    - name: metrics
      port: 15692
