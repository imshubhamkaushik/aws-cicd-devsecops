jenkins:
  systemMessage: "Jenkins Bootstrap Mode (JCasC)"
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  disableRememberMe: false

  crumbIssuer:
    standard: {}

unclassified:
  location:
    url: "http://${JENKINS_URL}:8080/"
  globalLibraries:
    libraries:
      - name: "catalogix-shared-library"
        defaultVersion: "main"
        retriever:
          modernSCM:
            scm:
              git:
                remote: "${GIT_REPO_URL}"
                credentialsId: "github-token"

  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "http://${SONARQUBE_HOST}:9000"
        credentialsId: "sonarqube-token"

tool:
  git:
    installations:
      - name: "git"
        home: "/usr/bin/git"

  maven:
    installations:
      - name: "maven"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

  nodejs:
    installations:
      - name: "node"
        properties:
          - installSource:
              installers:
                # Keep in step with app/frontend/Dockerfile (node:24-alpine),
                # app/frontend/.nvmrc and package.json "engines" — the tests CI runs
                # should execute on the same Node major the image is built with.
                - nodeJSInstaller:
                    id: "24.11.0"
                    npmPackagesRefreshHours: 72

configuration-as-code:
  version: 1
  deprecated: warn
  restricted: reject
  unknown: reject

credentials:
  system:
    domainCredentials:
      - credentials:
          # GitHub Token
          - string:
              scope: GLOBAL
              id: "github-token"
              secret: "${GITHUB_TOKEN}"
          # SonarQube Token
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONARQUBE_TOKEN}"

# Job Definitions. The multibranch quality/security gate is the only webhook-driven job.
jobs:
  # Pre-deployment quality and security gate (pull requests + branches).
  # The repo URL is parsed so this works after the operator sets GIT_REPO_URL.
  - script: |
      def cloneUrl = System.getenv('GIT_REPO_URL') ?: ''
      def matcher = (cloneUrl =~ /github\.com[:\/]([^\/]+)\/([^\/]+?)(?:\.git)?$/)
      if (!matcher.find()) { throw new IllegalStateException('GIT_REPO_URL must be a GitHub HTTPS or SSH repository URL') }
      def repoOwner = matcher.group(1)
      def repoName = matcher.group(2)
      multibranchPipelineJob('quality-security-gate') {
        description('Required repository lint, quality and security checks for pushes and pull requests')
        branchSources {
          github {
            id('catalogix-quality-security-gate')
            repoOwner(repoOwner)
            repository(repoName)
            credentialsId('github-token')
            traits {
              gitHubBranchDiscovery { strategyId(1) }
              gitHubPullRequestDiscovery { strategyId(1) }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('infra/jenkins/Jenkinsfile.lint')
          }
        }
        orphanedItemStrategy { discardOldItems { numToKeep(20) } }
        triggers { periodicFolderTrigger { interval('1d') } }
      }

  # Platform Infra Pipeline — manual only; never triggered directly by repository webhooks.
  - script: >
      pipelineJob('platform-infra') {
        description('Provision infrastructure using Terraform')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL}')
                  credentials('github-token')
                }
                branches('*/main')
              }
            }
            scriptPath('infra/jenkins/Jenkinsfile.platform-infra')
          }
        }
      }

  # Application CICD Pipeline
  - script: >
      pipelineJob('app-cicd') {
        description('Application CICD Pipeline - Build, Scan, Deploy (triggered only by a successful quality/security gate or manually)')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL}')
                  credentials('github-token')
                }
                branches('*/main')
              }
            }
            scriptPath('infra/jenkins/Jenkinsfile.app-cicd')
          }
        }
      }
