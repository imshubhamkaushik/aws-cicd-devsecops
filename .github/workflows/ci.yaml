# Repository quality and security gate.
#
# Runs on every push to main and on every pull request. It needs nothing from AWS, so it lives
# in GitHub Actions instead of Jenkins (GitHub cannot reach the IP-restricted Jenkins UI, and
# Actions runs without any inbound connection).
#
# The last job, `ci-gate`, succeeds only if every other job succeeded. It is the single check
# that matters:
#   * on pull requests, make `ci-gate` a required status check in the branch protection rule;
#   * on main, Jenkinsfile.app-cicd asks the GitHub API whether `ci-gate` passed for the exact
#     commit it is about to deploy (scripts/python/ci/verify_github_gate.py) and refuses to deploy
#     otherwise.
# Do not rename the `ci-gate` job without changing --check-name in Jenkinsfile.app-cicd.
#
# What stays in Jenkins because it needs AWS or the private network: the SonarQube analysis,
# image build and image scan, the ECR push, the Helm deploy and `terraform plan` on live state.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Runs unit tests and the Testcontainers integration tests (Docker is preinstalled).
      - run: mvn -B verify

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  tooling:
    name: Python tooling + shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Ruff's S rules are the security checks (bandit equivalent) for the operator scripts.
      - run: ruff check .
        working-directory: scripts/python
      - run: python3 -m unittest discover -s scripts/python/tests
      - run: shellcheck scripts/bash/*.sh

  security:
    name: Secrets + Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks also scans history
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source /repo --exit-code 1 --redact
      - name: Hadolint
        run: |
          for f in $(find app -maxdepth 3 -name Dockerfile); do
            echo "=== hadolint: $f ==="
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --config /dev/null - < "$f"
          done

  infra:
    name: Infrastructure (Terraform, Ansible, Helm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # One source of truth for scanner and tool versions: the same Ansible variables that
      # install them on the Jenkins server and that the local scan scripts read.
      - name: Resolve tool versions
        id: v
        run: |
          vars=infra/ansible/group_vars/all/vars.yaml
          trivy=$(grep '^trivy_version:' "$vars" | awk -F'"' '{print $2}')
          helm=$(grep '^helm_version:' "$vars" | awk -F'"' '{print $2}')
          [ -n "$trivy" ] && [ -n "$helm" ] || { echo "trivy_version or helm_version missing in $vars"; exit 1; }
          echo "trivy=$trivy" >> "$GITHUB_OUTPUT"
          echo "helm=$helm" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.v.outputs.helm }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Terraform ----
      # fmt only: module directories declare no providers, so `terraform validate` on them fails
      # for reasons unrelated to the code. Real validate/plan runs per environment in platform-infra.
      - name: Terraform format
        run: terraform fmt -check -recursive -diff infra/terraform/

      - name: Trivy IaC scan (Terraform)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:${{ steps.v.outputs.trivy }} config \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile /repo/.trivyignore /repo/infra/terraform/

      # ---- Ansible ----
      - name: Ansible lint
        run: |
          pip install ansible-lint
          ansible-galaxy collection install -r infra/ansible/requirements.yaml
          cd infra/ansible
          ansible-lint playbook.yaml

      # ---- Helm ----
      - name: Helm dependencies
        run: |
          # The monitoring chart's sub-chart must be present before it can be linted or rendered.
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm dependency build infra/helm/monitoring

      - name: Helm lint
        run: |
          helm lint infra/helm/catalogix-hc --values infra/helm/catalogix-hc/values-dev.yaml
          helm lint infra/helm/catalogix-hc --values infra/helm/catalogix-hc/values-staging.yaml
          helm lint infra/helm/monitoring

      # Rendering and validating against the Kubernetes schemas also catches typo'd fields and wrong
      # apiVersions. -ignore-missing-schemas because ExternalSecret, ServiceMonitor and similar CRDs
      # have no schema in kubeconform's default catalogue. Render to a file first so a chart that
      # fails to render cannot "pass" by feeding kubeconform an empty stream.
      - name: Helm render + kubeconform
        run: |
          for values in values-dev.yaml values-staging.yaml; do
            echo "=== kubeconform: infra/helm/catalogix-hc (${values}) ==="
            helm template infra/helm/catalogix-hc --values "infra/helm/catalogix-hc/${values}" > "$RUNNER_TEMP/rendered.yaml"
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas < "$RUNNER_TEMP/rendered.yaml"
          done
          echo "=== kubeconform: infra/helm/monitoring ==="
          helm template infra/helm/monitoring > "$RUNNER_TEMP/rendered.yaml"
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas < "$RUNNER_TEMP/rendered.yaml"

      # The pipeline's per-service image keys must match what the chart reads.
      - name: Helm image-tag contract
        run: python3 scripts/python/ci/check_helm_image_tags.py infra/helm/catalogix-hc/values-dev.yaml

      - name: Trivy IaC scan (Helm chart)
        run: |
          docker run --rm -v "$PWD/infra/helm/catalogix-hc:/chart" -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy:${{ steps.v.outputs.trivy }} config \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile /.trivyignore /chart

  # The single check to require on pull requests and the one Jenkins verifies before a deploy.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [backend, frontend, tooling, security, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "ci-gate failed: at least one job did not succeed"; exit 1; }
          done
