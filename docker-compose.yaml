# Local stack: every service has a memory and CPU limit so the JVMs size their
# heaps and thread pools from the container, not from the host.
# Total ceiling is about 6 GB RAM and 4 CPUs.
services:
  postgres:
    mem_limit: 512m
    cpus: 0.35
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      # One database and one role per service, created on first start.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [catalogix]

  # Message broker: user-svc and checkout-svc publish events, notification-svc consumes them.
  rabbitmq:
    mem_limit: 512m
    cpus: 0.6
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "25672:15672" # management UI (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks: [catalogix]

  # Local SMTP catcher for notification-svc. Sent mail: http://localhost:8025
  mailpit:
    mem_limit: 128m
    cpus: 0.1
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [catalogix]
    

  user-svc:
    mem_limit: 512m
    cpus: 0.325
    image: catalogix-user-svc:latest
    build:
      context: .
      dockerfile: backend/user-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-users
      SPRING_DATASOURCE_USERNAME: user_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Local compose serves plain HTTP; a Secure cookie would be dropped by the browser.
      REFRESH_COOKIE_SECURE: "false"
      # Bootstrap admin, created on first start if none exists. Local use only.
      SEED_ADMIN_EMAIL: admin@catalogix.local
      SEED_ADMIN_PASSWORD: AdminAdminAdmin
    expose:
      - "11005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [catalogix]

  # Product metadata: name, description, price, category. Stock lives in inventory-svc.
  catalog-svc:
    mem_limit: 512m
    cpus: 0.325
    image: catalogix-catalog-svc:latest
    build:
      context: .
      dockerfile: backend/catalog-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-catalog
      SPRING_DATASOURCE_USERNAME: catalog_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      INVENTORY_SVC_URL: http://inventory-svc:11003
      SEED_DATA: "true"
    expose:
      - "11002"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-svc:
        condition: service_started
    networks: [catalogix]

  # Stock levels. The only service allowed to change them.
  inventory-svc:
    mem_limit: 384m
    cpus: 0.275
    image: catalogix-inventory-svc:latest
    build:
      context: .
      dockerfile: backend/inventory-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-inventory
      SPRING_DATASOURCE_USERNAME: inventory_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "11003"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [catalogix]

  # Server-side cart. Reads prices from catalog-svc and stock from inventory-svc; never reserves stock.
  cart-svc:
    mem_limit: 384m
    cpus: 0.275
    image: catalogix-cart-svc:latest
    build:
      context: .
      dockerfile: backend/cart-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-cart
      SPRING_DATASOURCE_USERNAME: cart_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SVC_URL: http://catalog-svc:11002
      INVENTORY_SVC_URL: http://inventory-svc:11003
    expose:
      - "11004"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [catalogix]

  # Mock payment processing. Only checkout-svc calls it; not exposed by the gateway.
  payment-svc:
    mem_limit: 384m
    cpus: 0.275
    image: catalogix-payment-svc:latest
    build:
      context: .
      dockerfile: backend/payment-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-payment
      SPRING_DATASOURCE_USERNAME: payment_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "11006"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [catalogix]

  # Checkout saga orchestrator: owns orders and calls cart, inventory and payment with compensation on failure.
  checkout-svc:
    mem_limit: 640m
    cpus: 0.25
    image: catalogix-checkout-svc:latest
    build:
      context: .
      dockerfile: backend/checkout-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-checkout
      SPRING_DATASOURCE_USERNAME: checkout_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SVC_URL: http://catalog-svc:11002
      INVENTORY_SVC_URL: http://inventory-svc:11003
      PAYMENT_SVC_URL: http://payment-svc:11006
      CART_SVC_URL: http://cart-svc:11004
      USER_SVC_URL: http://user-svc:11005
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "11007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # The Java images are distroless (no shell), so there are no container healthchecks;
      # these only order container start.
      catalog-svc:
        condition: service_started
      inventory-svc:
        condition: service_started
      payment-svc:
        condition: service_started
      cart-svc:
        condition: service_started
      user-svc:
        condition: service_started
    networks: [catalogix]

  # Java services have no container healthcheck (distroless); they rely on depends_on and restart.

  notification-svc:
    mem_limit: 384m
    cpus: 0.25
    image: catalogix-notification-svc:latest
    build:
      context: .
      dockerfile: backend/notification-svc/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogix-notification
      SPRING_DATASOURCE_USERNAME: notification_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-noreply@catalogix.local}
      USER_SVC_URL: http://user-svc:11005
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "11008"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      user-svc:
        condition: service_started
    networks: [catalogix]

  frontend:
    # Internal service port; only gateway publishes host port 11000.
    mem_limit: 256m
    cpus: 0.1
    image: catalogix-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "11001"
    networks: [catalogix]

  gateway:
    # Sole browser-facing host endpoint: localhost:11000 -> gateway:11000.
    mem_limit: 128m
    cpus: 0.1
    image: catalogix-gateway:latest
    build:
      context: ./gateway
    restart: unless-stopped
    ports:
      - "11000:11000"
    depends_on:
      user-svc:
        condition: service_started
      catalog-svc:
        condition: service_started
      checkout-svc:
        condition: service_started
      cart-svc:
        condition: service_started
      # nginx resolves every proxy_pass host when it starts and exits if one is unknown.
      notification-svc:
        condition: service_started
      frontend:
        condition: service_healthy
    networks: [catalogix]

networks:
  catalogix:
    driver: bridge

volumes:
  postgres_data:
